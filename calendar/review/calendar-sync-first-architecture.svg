<text x="720" y="230" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#24394e" text-anchor="middle">Upload changed records</text>
<text x="720" y="261" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#24394e" text-anchor="middle">Download changes since last sync</text>
<text x="720" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Avoid repeated full-history transfers</text>
<text x="720" y="655" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Sync on edits, resume, reconnect,</text>
<text x="720" y="681" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">manual request + measured refresh</text>
<rect x="30" y="765" width="1380" height="280" rx="18" fill="#eaf1fb" stroke="#b9cbe2" stroke-width="1.5"/>
<text x="60" y="805" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#24394e" text-anchor="start">LATEST SUCCESSFUL SYNC WINS — per record, using service-assigned order</text>
<rect x="65" y="840" width="370" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="250.0" y="872" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">1. Edit saved on device A</text>
<text x="250.0" y="899" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Pending upload; safely stored locally</text>
<rect x="535" y="840" width="370" height="95" rx="18" fill="#fff2d8" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="720.0" y="872" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">2. Service accepts the edit</text>
<text x="720.0" y="899" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Assigns a new authoritative revision</text>
<rect x="1005" y="840" width="370" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="1190.0" y="872" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">3. Device B receives it</text>
<text x="1190.0" y="899" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Both devices converge on that revision</text>
<polyline points="435,888 535,888" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="905,888 1005,888" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="60" y="977" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#24394e" text-anchor="start">An older offline edit accepted later can become the current version.</text>
<text x="60" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#24394e" text-anchor="start">Keep replaced versions for recovery. Deduplicate retries. Preserve unsaved drafts. Downloads do not create new edits.</text>
<rect x="30" y="1080" width="1380" height="225" rx="18" fill="#f0eafa" stroke="#c8bde2" stroke-width="1.5"/>
<text x="60" y="1120" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#24394e" text-anchor="start">DEVELOPMENT AGENTS — build and verify the app; outside the running product</text>
