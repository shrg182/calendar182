<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1430" viewBox="0 0 1440 1430" role="img" aria-labelledby="title desc">
<title id="title">Calendar: mobile-first and cross-device sync</title><desc id="desc">Proposed first-release architecture. Each device has a React UI, deterministic calendar engines, local storage, and a durable sync queue. One shared service orders accepted changes. Changed records reach other devices. Replaced versions remain recoverable. Provider selection and implementation are pending.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486277"/></marker></defs>
<rect width="1440" height="1430" fill="#f6f8fc"/>
<text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#24394e" text-anchor="start">Calendar — mobile-first, local-first, synchronized</text>
<text x="40" y="88" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#24394e" text-anchor="start">Updated proposal · 2026-11-16 · Basic cross-device sync is required in the first release</text>
<rect x="30" y="120" width="1380" height="610" rx="18" fill="#eaf5ef" stroke="#b3d2c1" stroke-width="1.5"/>
<text x="60" y="159" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#24394e" text-anchor="start">FIRST RELEASE: preserve existing features and improve mobile usability</text>
