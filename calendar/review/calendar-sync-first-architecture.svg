<rect x="65" y="355" width="430" height="110" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="280.0" y="387" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Local application services</text>
<text x="280.0" y="414" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Deterministic calendar / GanZhi engines</text>
<text x="280.0" y="438" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Shensha rules · Notes · Settings</text>
<rect x="65" y="510" width="430" height="110" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="280.0" y="542" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">IndexedDB + durable sync queue</text>
<text x="280.0" y="569" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Save locally immediately; work offline</text>
<text x="280.0" y="593" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Retry pending edits when connected</text>
<polyline points="280,310 280,355" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="280,465 280,510" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="280" y="665" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#24394e" text-anchor="middle">Saved locally ≠ synchronized</text>
