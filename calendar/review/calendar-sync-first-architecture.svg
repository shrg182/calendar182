<text x="720.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">One shared sync service</text>
<text x="720.0" y="424" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">One verified provider first</text>
<text x="720.0" y="448" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Account isolation + revisions</text>
<text x="720.0" y="472" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Backend selection still pending</text>
