<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
<title id="title">How an AI agent works</title><desc id="desc">A goal leads to planning, tool use, checking results, and reporting. If more work is needed, the agent returns to planning.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486277"/></marker></defs>
<rect width="1320" height="520" fill="#f6f8fc"/>
<text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#24394e" text-anchor="start">How an AI agent works</text>
<text x="40" y="88" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#24394e" text-anchor="start">An agent chooses actions toward a goal and adjusts after seeing results.</text>
<rect x="40" y="185" width="220" height="110" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="150.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">1. Your goal</text>
<text x="150.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Fix note saving</text>
<rect x="300" y="185" width="220" height="110" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="410.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">2. Agent plans</text>
<text x="410.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Inspect and reproduce</text>
<rect x="560" y="185" width="220" height="110" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="670.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">3. Agent uses tools</text>
<text x="670.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Read code · Edit · Test</text>
<rect x="820" y="185" width="220" height="110" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="930.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">4. Agent checks</text>
<text x="930.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Did the fix work?</text>
<rect x="1080" y="185" width="220" height="110" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="1190.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">5. Agent reports</text>
<text x="1190.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Evidence and limits</text>
<polyline points="260,240 300,240" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="520,240 560,240" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="780,240 820,240" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1040,240 1080,240" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="930,295 930,370 410,370 410,295" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="670" y="359" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#24394e" text-anchor="middle">Needs more work: revise the plan and try again</text>
<text x="1060" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#24394e" text-anchor="start">Ready</text>
<text x="40" y="445" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#24394e" text-anchor="start">Tools perform operations. The agent decides which allowed operations to use.</text>
<text x="40" y="481" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#24394e" text-anchor="start">An agent can make mistakes; checks and review remain necessary.</text>
</svg>
