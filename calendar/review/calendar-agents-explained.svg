<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1500" viewBox="0 0 1360 1500" role="img" aria-labelledby="title desc">
<title id="title">Calendar: development agents and the optional app assistant</title><desc id="desc">Development agents coordinate, design, implement, test, and review Calendar code. The finished app runs modules directly, with an optional assistant agent that calls reviewed tools.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486277"/></marker></defs>
<rect width="1360" height="1500" fill="#f6f8fc"/>
<text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#24394e" text-anchor="start">Where agents work in Calendar</text>
<text x="40" y="87" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#24394e" text-anchor="start">Development agents build the product. An optional assistant agent helps users inside it.</text>
<rect x="450" y="115" width="460" height="95" rx="18" fill="#fff2d8" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="680.0" y="147" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">YOU — product owner</text>
<text x="680.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Set goals, priorities, and important approvals</text>
<rect x="30" y="240" width="1300" height="630" rx="18" fill="#eaf1fb" stroke="#b9cbe2" stroke-width="1.5"/>
<text x="60" y="278" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#24394e" text-anchor="start">1. DEVELOPMENT AGENTS — work in Codex</text>
<polyline points="680,210 680,240 1080,240 1080,350 900,350" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="460" y="305" width="440" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="680.0" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Coordinator Agent</text>
<text x="680.0" y="364" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Plans tasks and coordinates integration</text>
<polyline points="680,400 680,435" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="460" y="435" width="440" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="680.0" y="467" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Architecture Agent</text>
<text x="680.0" y="494" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Defines module boundaries and interfaces</text>
<rect x="80" y="570" width="360" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="260.0" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Frontend Agent</text>
<text x="260.0" y="629" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Builds screens and interactions</text>
<rect x="480" y="570" width="360" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="660.0" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Calendar Logic Agent</text>
<text x="660.0" y="629" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Implements calculation rules</text>
<rect x="880" y="570" width="360" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="1060.0" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Storage Agent</text>
<text x="1060.0" y="629" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Builds notes, backups, and sync</text>
<polyline points="680,530 680,550 260,550 260,570" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,530 680,570" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,550 1060,550 1060,570" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="260" y="725" width="360" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="440.0" y="757" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Testing Agent</text>
<text x="440.0" y="784" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Runs checks and investigates failures</text>
<rect x="740" y="725" width="360" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="920.0" y="757" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Review Agent</text>
<text x="920.0" y="784" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Checks changes, risks, and evidence</text>
<polyline points="260,665 260,695 440,695 440,725" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="660,665 660,695 440,695 440,725" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1060,665 1060,695 440,695 440,725" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="620,772 740,772" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1100,772 1270,772 1270,350 900,350" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="1260" y="710" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#24394e" text-anchor="middle">Revision</text>
<text x="1260" y="734" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#24394e" text-anchor="middle">requests</text>
<text x="60" y="848" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#24394e" text-anchor="start">These roles produce code; they do not need to stay running for Calendar to work.</text>
<polyline points="920,820 920,920 680,920 680,990" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="690" y="908" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#24394e" text-anchor="start">Reviewed code builds the product</text>
<rect x="30" y="950" width="1300" height="420" rx="18" fill="#eaf5ef" stroke="#b3d2c1" stroke-width="1.5"/>
<text x="60" y="988" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#24394e" text-anchor="start">2. FINISHED CALENDAR APP — runs on the user’s device</text>
<rect x="80" y="1030" width="330" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="245.0" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Calendar UI</text>
<text x="245.0" y="1089" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Month · Day details · Notes</text>
<rect x="520" y="1030" width="360" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="700.0" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Application modules</text>
<text x="700.0" y="1089" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Calculations · Notes · Search</text>
<rect x="980" y="1030" width="290" height="95" rx="18" fill="#ffffff" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="1125.0" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Local data</text>
<text x="1125.0" y="1089" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Notes and settings</text>
<polyline points="410,1065 520,1065" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="465" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#24394e" text-anchor="middle">Taps</text>
<polyline points="880,1078 980,1078" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="1210" width="440" height="100" rx="18" fill="#f0eafa" stroke="#b5c4d4" stroke-width="1.5"/>
<text x="300.0" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24394e" text-anchor="middle">Optional Assistant Agent</text>
<text x="300.0" y="1269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="middle">Understands requests; chooses tools</text>
<polyline points="245,1125 245,1210" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="265" y="1162" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="start">Conversational request</text>
<polyline points="520,1240 700,1240 700,1125" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="720" y="1215" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="start">Calls reviewed tools</text>
<polyline points="820,1125 820,1280 520,1280" fill="none" stroke="#486277" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="840" y="1286" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="start">Returns results</text>
<text x="60" y="1344" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#24394e" text-anchor="start">Example request: “Find my travel notes from October.”</text>
<text x="40" y="1417" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#24394e" text-anchor="start">AGENT = chooses actions toward a goal.     MODULE = executes a defined operation.</text>
<text x="40" y="1454" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#24394e" text-anchor="start">Conceptual roles only: this diagram does not mean separate agents or the Assistant are currently running.</text>
</svg>
