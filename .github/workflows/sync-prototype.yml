name: Isolated sync prototype
on:
  push:
    branches: [sync-prototype]
    paths: ['prototype/sync/**', '.github/workflows/sync-prototype.yml']
  pull_request:
    paths: ['prototype/sync/**', '.github/workflows/sync-prototype.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s prototype/sync -p 'test_*.py' -v
